name: Repository Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update status
        run: |
          echo "Last heartbeat: $(date -u)" > status.txt

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add status.txt
          git commit -m "chore: heartbeat update" || exit 0
          git push
